<section class="deck">
  <header class="deck__bar">
    <div class="deck__heading">
      <span class="deck__eyebrow">Live demo</span>
      <h2 class="deck__title">{{ current().title }}</h2>
    </div>

    <nav class="deck__dots" aria-label="Concepts">
      @for (c of concepts; track c.id; let i = $index) {
        <button
          class="dot"
          [class.dot--active]="i === index()"
          (click)="go(i)"
          [title]="c.title"
          [attr.aria-label]="c.title"
          [attr.aria-current]="i === index() ? 'true' : null"
        ></button>
      }
    </nav>

    <div class="deck__controls">
      <button class="nav-btn" (click)="prev()" [disabled]="index() === 0">← Prev</button>
      <span class="deck__progress">{{ index() + 1 }} / {{ total }}</span>
      <button class="nav-btn" (click)="next()" [disabled]="index() === total - 1">Next →</button>
    </div>
  </header>

  <p class="deck__blurb">{{ current().blurb }}</p>

  <div class="deck__body">
    <div class="panel panel--code">
      <div class="panel__label">Code</div>
      <pre class="code"><code>{{ current().source }}</code></pre>
    </div>

    <div class="panel panel--live">
      <div class="panel__label">Live — interact, or edit the source &amp; watch it hot-reload</div>
      <div class="live-host">
        <ng-container [ngComponentOutlet]="current().component" />
      </div>
    </div>
  </div>

  <footer class="deck__foot">
    Use <kbd>←</kbd> / <kbd>→</kbd> to move between concepts.
  </footer>
</section>
